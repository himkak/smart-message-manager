[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-messages-manager"
version = "0.1.0"
description = "A privacy-conscious personal communications search application."
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.9,<4.0",
  "aiosqlite>=0.20,<1.0",
  "azure-search-documents>=11.5,<12.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "itsdangerous>=2.2,<3.0",
  "openai>=1.40,<2.0",
  "pydantic-settings>=2.6,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.8,<1.0",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
